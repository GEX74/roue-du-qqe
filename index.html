<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La roue du QQE</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --gold: #fbbf24;
      --gold-dark: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      user-select: none;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #60a5fa 0%, #fbbf24 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 4px 15px rgba(245, 158, 11, 0.3));
      cursor: default;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 48px;
      max-width: 1200px;
      width: 100%;
    }

    /* Conteneur de la roue */
    .wheel-wrapper {
      position: relative;
      width: 520px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* Flèche pointeur stylisée */
    .pointer-container {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
    }

    .pointer {
      width: 36px;
      height: 48px;
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      clip-path: polygon(50% 100%, 0% 15%, 15% 0%, 85% 0%, 100% 15%);
      border-radius: 4px;
      transform-origin: 50% 10%;
      transition: transform 0.07s ease-out;
    }

    .pointer.tick {
      transform: rotate(-18deg);
    }

    /* Bouton central */
    .center-button {
      position: absolute;
      width: 104px;
      height: 104px;
      background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #1d4ed8 70%, #0f172a 100%);
      border: 5px solid #ffffff;
      border-radius: 50%;
      color: #ffffff;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 0 0 4px var(--gold),
        0 10px 25px rgba(0,0,0,0.6),
        inset 0 -4px 8px rgba(0,0,0,0.4);
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
      z-index: 10;
    }

    .center-button:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: 
        0 0 0 6px var(--gold),
        0 0 30px rgba(59, 130, 246, 0.7),
        0 10px 25px rgba(0,0,0,0.6);
    }

    .center-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    .center-button:disabled {
      background: #475569;
      box-shadow: 0 0 0 3px #64748b;
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* Panneau de configuration */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    .panel h2 {
      font-size: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .badge {
      font-size: 0.8rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    textarea {
      width: 100%;
      height: 200px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: all 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button.btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    button.btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    button.btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      box-shadow: none;
    }

    button.btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    /* Pop-up Résultat */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(6px);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid var(--gold);
      border-radius: 24px;
      padding: 36px 32px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(251, 191, 36, 0.3);
    }

    .modal-backdrop.open .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .modal .winner-name {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ffffff;
      margin: 12px 0 8px;
      word-break: break-word;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .modal .funny-phrase {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    /* Panneau Secret (Mode discret) */
    .secret-box {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111827;
      border: 1px dashed #ef4444;
      border-radius: 12px;
      padding: 14px 18px;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      font-size: 0.85rem;
    }

    .secret-box.active {
      display: block;
    }

    .secret-box label {
      color: #f87171;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    .secret-box select {
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      width: 100%;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    canvas#confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="secretTitleTrigger">La roue du QQE</h1>
    <p class="subtitle">Qui sera l'heureux(se) élu(e) ?</p>
  </header>

  <div class="main-layout">
    <!-- Zone Roue -->
    <div class="wheel-wrapper">
      <div class="pointer-container">
        <div class="pointer" id="pointer"></div>
      </div>
      <canvas id="wheelCanvas" width="900" height="900"></canvas>
      <button class="center-button" id="spinBtn">TOURNER</button>
    </div>

    <!-- Configuration -->
    <div class="panel">
      <h2>
        Participants
        <span class="badge" id="namesCount">0</span>
      </h2>
      <label for="namesInput">Un nom par ligne :</label>
      <textarea id="namesInput" spellcheck="false"></textarea>
      <div class="btn-row">
        <button class="btn btn-secondary" id="shuffleBtn">Mélanger</button>
        <button class="btn" id="updateBtn">Appliquer</button>
      </div>
    </div>
  </div>

  <!-- Pop-up Résultat -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>Désigné(e) par le QQE !</h3>
      <div class="winner-name" id="winnerName">---</div>
      <div class="funny-phrase" id="funnyPhrase">...</div>
      <button class="btn" id="closeModalBtn" style="width: 100%;">Fermer</button>
    </div>
  </div>

  <!-- Mode Secret -->
  <div class="secret-box" id="secretBox">
    <label>🤫 Mode discret QQE :</label>
    <select id="riggedTargetSelect">
      <option value="">-- Tirage normal (Aléatoire) --</option>
    </select>
    <button class="btn btn-secondary" style="padding: 6px; font-size: 0.75rem; width: 100%;" id="closeSecretBtn">Masquer (ou Échap)</button>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    // Couleurs vives et contrastées
    const COLORS = [
      '#e11d48', '#ea580c', '#d97706', '#059669',
      '#0891b2', '#2563eb', '#7c3aed', '#c026d3',
      '#0d9488', '#4f46e5', '#db2777', '#65a30d'
    ];

    const FUNNY_QUOTES = [
      "Le hasard fait décidément bien les choses ! 😉",
      "Promis juré, la roue n'est absolument pas truquée 😇",
      "Désigné(e) volontaire d'office !",
      "C'est toi qui régales les croissants la prochaine fois ?",
      "Aucune réclamation ne sera acceptée par l'administration.",
      "Le destin a parlé sans hésiter.",
      "On applaudit bien fort notre vedette !",
      "La décision de la Roue du QQE est irrévocable."
    ];

    let names = ["Audrey", "Pascal", "Nicolas", "Julien", "Valentin", "Raphaël"];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const pointer = document.getElementById('pointer');
    const namesInput = document.getElementById('namesInput');
    const namesCount = document.getElementById('namesCount');
    const updateBtn = document.getElementById('updateBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const winnerNameEl = document.getElementById('winnerName');
    const funnyPhraseEl = document.getElementById('funnyPhrase');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');

    const secretBox = document.getElementById('secretBox');
    const riggedTargetSelect = document.getElementById('riggedTargetSelect');
    const closeSecretBtn = document.getElementById('closeSecretBtn');
    const secretTitleTrigger = document.getElementById('secretTitleTrigger');

    let currentAngle = 0;
    let isSpinning = false;
    let lastTickIndex = -1;
    let riggedTarget = "";

    // Sons synthétisés
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(480, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);

      pointer.classList.add('tick');
      setTimeout(() => pointer.classList.remove('tick'), 70);
    }

    function playFanfare() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
        gain.gain.setValueAtTime(0.28, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.6);
      });
    }

    function init() {
      namesInput.value = names.join('\n');
      updateCount();
      updateSecretDropdown();
      drawWheel();
      resizeConfetti();
      window.addEventListener('resize', resizeConfetti);
    }

    function updateCount() {
      namesCount.textContent = `${names.length} nom${names.length > 1 ? 's' : ''}`;
    }

    function updateSecretDropdown() {
      const current = riggedTargetSelect.value;
      riggedTargetSelect.innerHTML = '<option value="">-- Tirage normal (Aléatoire) --</option>';
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = `🎯 Forcer : ${n}`;
        riggedTargetSelect.appendChild(opt);
      });
      riggedTargetSelect.value = names.includes(current) ? current : "";
      riggedTarget = riggedTargetSelect.value;
    }

    // Dessin de la Roue
    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const outerBorderWidth = 26;
      const radius = center - outerBorderWidth - 6;

      ctx.clearRect(0, 0, size, size);

      if (names.length === 0) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Ajoutez des participants', center, center);
        return;
      }

      const arc = (2 * Math.PI) / names.length;

      // 1. Dessin des parts et des noms
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(currentAngle);

      names.forEach((name, i) => {
        const angle = i * arc;
        const color = COLORS[i % COLORS.length];

        // Part
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, angle, angle + arc);
        ctx.fillStyle = color;
        ctx.fill();

        // Séparateur fin blanc
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dessin du texte (grand et lisible)
        ctx.save();
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        // Calcul dynamique de la taille de police pour maximiser la lisibilité
        let fontSize = 34;
        if (names.length > 8) fontSize = 28;
        if (names.length > 14) fontSize = 22;
        if (names.length > 20) fontSize = 18;

        ctx.font = `900 ${fontSize}px "Impact", "Arial Black", system-ui, sans-serif`;

        // Contour noir du texte (pour un détachement maximal)
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#000000';
        ctx.lineJoin = 'round';
        ctx.miterLimit = 2;
        ctx.strokeText(name, radius - 24, 0);

        // Intérieur du texte blanc éclatant
        ctx.fillStyle = '#ffffff';
        ctx.fillText(name, radius - 24, 0);

        ctx.restore();
      });

      ctx.restore();

      // 2. Bordure extérieure "Show TV" dorée avec ampoules
      ctx.save();
      ctx.translate(center, center);

      // Anneau doré extérieur
      ctx.beginPath();
      ctx.arc(0, 0, radius + outerBorderWidth / 2, 0, 2 * Math.PI);
      ctx.lineWidth = outerBorderWidth;
      const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
      grad.addColorStop(0, '#f59e0b');
      grad.addColorStop(0.5, '#fde68a');
      grad.addColorStop(1, '#b45309');
      ctx.strokeStyle = grad;
      ctx.stroke();

      // Filet intérieur sombre
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#78350f';
      ctx.stroke();

      // Ampoules lumineuses
      const numLights = Math.max(names.length * 2, 24);
      for (let i = 0; i < numLights; i++) {
        const lightAngle = (i * 2 * Math.PI) / numLights;
        const lx = Math.cos(lightAngle) * (radius + outerBorderWidth / 2);
        const ly = Math.sin(lightAngle) * (radius + outerBorderWidth / 2);

        ctx.beginPath();
        ctx.arc(lx, ly, 4.5, 0, 2 * Math.PI);
        ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#fef08a';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0; // reset
      }

      ctx.restore();
    }

    // Animation & Décélération
    function spin() {
      if (isSpinning || names.length === 0) return;
      isSpinning = true;
      spinBtn.disabled = true;

      const sliceAngle = (2 * Math.PI) / names.length;
      let targetIndex;

      if (riggedTarget && names.includes(riggedTarget)) {
        targetIndex = names.indexOf(riggedTarget);
      } else {
        targetIndex = Math.floor(Math.random() * names.length);
      }

      // Nombre de tours (6 à 8 tours)
      const minFullRotations = 6 + Math.floor(Math.random() * 3);
      const currentNorm = currentAngle % (2 * Math.PI);
      
      // Calage sous le pointeur au sommet (3*PI/2) avec léger aléatoire
      const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.5);
      let targetFinalAngle = (3 * Math.PI / 2) - (targetIndex * sliceAngle + sliceAngle / 2) + randomOffset;
      
      while (targetFinalAngle <= currentNorm) {
        targetFinalAngle += 2 * Math.PI;
      }
      const totalTargetAngle = currentAngle + (targetFinalAngle - currentNorm) + (minFullRotations * 2 * Math.PI);

      const startAngle = currentAngle;
      const duration = 5200 + Math.random() * 1000;
      const startTime = performance.now();

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easedProgress = easeOutCubic(progress);

        currentAngle = startAngle + (totalTargetAngle - startAngle) * easedProgress;

        const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI)) + (3 * Math.PI / 2)) % (2 * Math.PI);
        const currentSliceIndex = Math.floor(normalizedAngle / sliceAngle);

        if (currentSliceIndex !== lastTickIndex) {
          playTick();
          lastTickIndex = currentSliceIndex;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          showWinner(targetIndex);
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner(index) {
      winnerNameEl.textContent = names[index];
      funnyPhraseEl.textContent = FUNNY_QUOTES[Math.floor(Math.random() * FUNNY_QUOTES.length)];
      modalBackdrop.classList.add('open');
      playFanfare();
      launchConfetti();
    }

    // Confettis
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function launchConfetti() {
      confettiParticles = [];
      for (let i = 0; i < 140; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          w: Math.random() * 12 + 6,
          h: Math.random() * 6 + 4,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.7) * 20,
          gravity: 0.35,
          rotation: Math.random() * 360,
          vRotation: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
      animateConfetti();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;

      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.rotation += p.vRotation;
        p.opacity -= 0.007;

        if (p.opacity > 0) {
          alive = true;
          confettiCtx.save();
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate((p.rotation * Math.PI) / 180);
          confettiCtx.fillStyle = p.color;
          confettiCtx.globalAlpha = Math.max(0, p.opacity);
          confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          confettiCtx.restore();
        }
      });

      if (alive) {
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    function updateNamesFromInput() {
      if (isSpinning) return;
      const raw = namesInput.value.split('\n');
      names = raw.map(n => n.trim()).filter(n => n.length > 0);
      updateCount();
      updateSecretDropdown();
      drawWheel();
    }

    function shuffleNames() {
      if (isSpinning) return;
      for (let i = names.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [names[i], names[j]] = [names[j], names[i]];
      }
      namesInput.value = names.join('\n');
      updateSecretDropdown();
      drawWheel();
    }

    // Raccourci secret : mot-clé "qqe"
    let secretKeys = "";
    window.addEventListener('keydown', (e) => {
      if (e.key === "Escape") {
        secretBox.classList.remove('active');
        return;
      }
      if (e.target === namesInput) return;

      secretKeys += e.key.toLowerCase();
      if (secretKeys.length > 5) secretKeys = secretKeys.slice(-5);
      if (secretKeys.endsWith("qqe")) {
        secretBox.classList.toggle('active');
        secretKeys = "";
      }
    });

    // Triple clic sur le titre
    let titleClicks = 0;
    let titleTimer = null;
    secretTitleTrigger.addEventListener('click', () => {
      titleClicks++;
      clearTimeout(titleTimer);
      if (titleClicks >= 3) {
        secretBox.classList.toggle('active');
        titleClicks = 0;
      } else {
        titleTimer = setTimeout(() => { titleClicks = 0; }, 400);
      }
    });

    closeSecretBtn.addEventListener('click', () => secretBox.classList.remove('active'));
    riggedTargetSelect.addEventListener('change', (e) => {
      riggedTarget = e.target.value;
    });

    // Événements
    spinBtn.addEventListener('click', spin);
    updateBtn.addEventListener('click', updateNamesFromInput);
    shuffleBtn.addEventListener('click', shuffleNames);
    closeModalBtn.addEventListener('click', () => modalBackdrop.classList.remove('open'));

    init();
  </script>
</body>
</html>
